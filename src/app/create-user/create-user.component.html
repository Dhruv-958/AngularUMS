<div class="container">
  <h2>Create New User</h2>
  <form (ngSubmit)="createUser()">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" class="form-control" [(ngModel)]="user.name" name="name" required />
    </div>

    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" required />
    </div>

    <div class="form-group">
      <label for="mobile">Mobile:</label>
      <input type="text" id="mobile" class="form-control" [(ngModel)]="user.mobile" name="mobile" required />
    </div>

    <div class="form-group">
      <label for="address">Address:</label>
      <textarea id="address" class="form-control" [(ngModel)]="user.address" name="address" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Create User</button>
    <button (click)="goBack()" class="btn btn-secondary">Cancel</button>
  </form>
</div>
